<button onclick="login()">

<script>

    //login function
    async function login() {
        const res = await fetch("/login", {
            method: "POST",
            headers: {
                "content-type":
                    "application/json"
            },
            body: JSON.stringify({
                username: username.value,
                password: password.value
            })

        });
